name: ballz_flutter
description: Brick breaker with elements, upgrades and boss fights.
publish_to: 'none'
version: 1.0.7+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  unity_ads_plugin: ^0.6.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.5
  games_services: ^4.0.1
  flame_audio: ^2.12.2
  vibration: ^3.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/elemental_ball_triade_espiral.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/adi-registration.properties
    # Áudio: listado arquivo a arquivo para não empacotar arquivos não usados
    - assets/audio/music_loop_long.ogg
    - assets/audio/hit_1.wav
    - assets/audio/hit_2.wav
    - assets/audio/hit_3.wav
    - assets/audio/hit_4.wav
    - assets/audio/block_break.wav
    - assets/audio/wall_bounce.wav
    - assets/audio/wave_clear.wav
    - assets/audio/level_complete.wav
